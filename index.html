<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffffff" />
  <title>GA Cleaning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 200vh; /* For testing; remove when you add page content */
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
    }

    /* White strip above the colored bar */
    .status-strip {
      height: 44px;
      background: #ffffff;
    }

    .top-bar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: #dde7fe;
    }

    .site-title {
      margin: 0;
      color: #0a4dff;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <header class="header-wrapper">
    <div class="status-strip" aria-hidden="true"></div>
    <div class="top-bar">
      <h1 class="site-title">GA Cleaning</h1>
    </div>
  </header>
</body>
</html>
