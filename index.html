<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>GA Cleaning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 200vh; /* For testing the sticky bar; remove when you add content */
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: #dde7fe;
      box-shadow: none;
    }

    .site-title {
      margin: 0;
      color: #0a4dff;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <h1 class="site-title">GA Cleaning</h1>
  </header>
</body>
</html>
