<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GA Cleaning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 200vh; /* Just for previewing the sticky bar while scrolling */
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 28px;

      background: rgba(221, 231, 254, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow: 0 4px 14px rgba(20, 45, 100, 0.12);
    }

    .site-title {
      margin: 0;
      color: #0a4dff;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <h1 class="site-title">GA Cleaning</h1>
  </header>
</body>
</html>
