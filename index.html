<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GA Cleaning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202a3a;
      background: #f7f8fc;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 32px;
      background: rgba(221, 231, 254, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(40, 55, 90, 0.12);
    }

    .top-bar nav {
      display: flex;
      direction: ltr;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo img {
      display: block;
      height: 30px;
      width: auto;
    }

    .links {
      display: flex;
      direction: rtl;
      gap: 24px;
    }

    .links a {
      color: inherit;
      text-decoration: none;
    }

    .hero-image {
      position: relative;
      width: 100%;
      height: clamp(240px, 40vw, 520px);
      overflow: hidden;
    }

    .hero-image > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(2px);
      transform: scale(1.03);
    }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(39, 104, 185, 0.35),
        rgba(39, 104, 185, 0.18)
      );
      pointer-events: none;
    }

    .hero-text {
      position: absolute;
      z-index: 1;
      top: 50%;
      right: 8%;
      transform: translateY(-50%);
      max-width: 60%;
      text-align: right;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .hero-text h1 {
      margin: 0 0 10px;
      color: #99e65c;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 600;
      line-height: 1.3;
    }

    .hero-text .main-text {
      margin: 0 0 12px;
      color: #fff;
      font-size: clamp(26px, 4vw, 48px);
      font-weight: 700;
      line-height: 1.2;
    }

    .hero-text .description {
      margin: 0;
      color: #ececee;
      font-size: clamp(18px, 2.4vw, 28px);
      line-height: 1.4;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .card {
      min-height: 300px;
      margin: 24px 0;
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 30px rgba(40, 55, 90, 0.14);
    }

    @media (min-width: 768px) {
      .logo {
        transform: translateX(24px);
      }
    }

    @media (max-width: 520px) {
      .top-bar {
        padding: 14px 18px;
      }

      .links {
        gap: 14px;
      }

      .hero-image {
        height: 65svh;
        min-height: 380px;
        max-height: 520px;
      }

      .hero-text {
        right: 6%;
        max-width: 82%;
      }

      .hero-text h1 {
        font-size: 20px;
      }

      .hero-text .main-text {
        font-size: 34px;
      }

      .hero-text .description {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <nav>
      <div class="logo">
        <img src="ga-icon.png" alt="GA Cleaning">
      </div>

      <div class="links">
        <a href="#">ראשי</a>
        <a href="#">אודות</a>
        <a href="#">צור קשר</a>
      </div>
    </nav>
  </header>

  <section class="hero-image">
    <img src="istock-903249194.jpg" alt="ניקיון מקצועי">

    <div class="hero-text">
      <h1>ניקיון בניינים מקצועי באזור הקריות</h1>
      <p class="main-text">הבניין שלכם מתוחזק בלי דאגות</p>
      <p class="description">
        שירותי ניקיון שוטפים לבנייני מגורים, עם הקפדה על איכות, אמינות ושירות אישי
      </p>
    </div>
  </section>

  <main>
    <section class="card">
      <h2>אודותינו</h2>
      <p>הוסיפו כאן את תוכן האתר.</p>
    </section>

    <section class="card">
      <h2>השירותים שלנו</h2>
      <p>הוסיפו כאן את השירותים שלכם.</p>
    </section>

    <section class="card">
      <h2>צור קשר</h2>
      <p>הוסיפו כאן את פרטי יצירת הקשר.</p>
    </section>
  </main>
</body>
</html>
