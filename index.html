<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GA Cleaning</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202a3a;
      background: #f7f8fc;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 32px;
      background: rgba(221, 231, 254, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(40, 55, 90, 0.12);
    }

    .top-bar nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo img {
      display: block;
      height: 30px;
      width: auto;
    }

    .links {
      display: flex;
      gap: 24px;
    }

    .links a {
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .card {
      min-height: 300px;
      margin: 24px 0;
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 30px rgba(40, 55, 90, 0.14);
    }

    @media (min-width: 768px) {
      .logo {
        transform: translateX(50px);
      }
    }

    @media (max-width: 520px) {
      .top-bar {
        padding: 14px 18px;
      }

      .links {
        gap: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <nav>
      <div class="logo">
        <img src="ga-icon.png" alt="GA Cleaning">
      </div>

      <div class="links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="card">
      <h1>Welcome</h1>
      <p>Scroll down to see the top bar stay in place.</p>
    </section>

    <section class="card">
      <h2>Section Two</h2>
    </section>

    <section class="card">
      <h2>Section Three</h2>
    </section>
  </main>
</body>
</html>
